<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 页面只跟自己说话：connect-src 关掉，堵住「渲染出的脚本把本地内容外发」这条路。
     Markdown 里的原始 HTML 由 sanitize() 去掉事件属性，见正文说明。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<script src="http://mdpeek.localhost/assets/marked.min.js"></script>
<script src="http://mdpeek.localhost/assets/highlight.min.js"></script>
<script src="http://mdpeek.localhost/assets/mermaid.min.js"></script>
<style>
:root {
  --paper: #FAFAF8;
  --ink: #1C2024;
  --ink-2: #5A6270;
  --hairline: #E4E2DC;
  --accent: #0F766E;
  --accent-soft: rgba(15,118,110,.14);
  --code-bg: #F2F1EB;
  --chrome-bg: #F4F3EF;
}
body.dark {
  --paper: #1A1C20;
  --ink: #DDD9D2;
  --ink-2: #8A8F98;
  --hairline: #2E3138;
  --accent: #4DBEAF;
  --accent-soft: rgba(77,190,175,.16);
  --code-bg: #22252B;
  --chrome-bg: #1F2126;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.75 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
}

::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 5px; border: 2px solid var(--paper); }
::-webkit-scrollbar-thumb:hover { background: var(--ink-2); }

/* ============ article ============ */
#content {
  max-width: 46em;
  margin: 0 auto;
  padding: 48px 40px 96px;
  min-width: 200px;
}
h1, h2, h3, h4, h5, h6 {
  font-weight: 650;
  letter-spacing: -0.01em;
  line-height: 1.35;
  margin: 1.9em 0 .7em;
}
h1 { font-size: 1.85em; margin-top: 0; padding-bottom: .35em; border-bottom: 1px solid var(--hairline); }
h2 { font-size: 1.45em; padding-bottom: .3em; border-bottom: 1px solid var(--hairline); }
h3 { font-size: 1.18em; }
h4 { font-size: 1.05em; }
p { margin: .9em 0; }
a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
strong { font-weight: 650; }
img { max-width: 100%; border-radius: 6px; }
ul, ol { padding-left: 1.6em; margin: .9em 0; }
li + li { margin-top: .3em; }
li > ul, li > ol { margin: .3em 0; }
input[type="checkbox"] { appearance: none; width: 15px; height: 15px; border: 1.5px solid var(--ink-2); border-radius: 4px; vertical-align: -2px; margin-right: 6px; cursor: default; }
input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:checked::after { content: ''; display: block; margin: 2.5px auto 0; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(42deg); }

blockquote {
  margin: 1.2em 0;
  padding: .1em 0 .1em 1.1em;
  border-left: 3px solid var(--accent-soft);
  color: var(--ink-2);
}
blockquote blockquote { padding-left: 1em; }

/* booktabs-style tables */
table { border-collapse: collapse; margin: 1.4em 0; width: 100%; font-size: .94em; }
thead { border-top: 2px solid var(--ink); }
thead tr { border-bottom: 1px solid var(--ink-2); }
tbody { border-bottom: 2px solid var(--ink); }
th, td { padding: .5em .9em; text-align: left; border: none; }
th { font-weight: 650; }
tbody tr + tr { border-top: 1px solid var(--hairline); }
tbody tr:nth-child(even) { background: transparent; }

code {
  font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  font-size: .86em;
  background: var(--code-bg);
  padding: .15em .4em;
  border-radius: 4px;
}
pre {
  background: var(--code-bg);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  padding: 14px 18px;
  overflow-x: auto;
  margin: 1.2em 0;
}
pre code { background: none; padding: 0; font-size: .84em; line-height: 1.6; }
.hljs { color: var(--ink); }
.hljs-comment, .hljs-quote { color: var(--ink-2); font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-type { color: var(--accent); font-weight: 600; }
.hljs-string, .hljs-regexp { color: #8A4B08; }
.hljs-number, .hljs-literal { color: #3455DB; }
.hljs-title, .hljs-name, .hljs-section { color: #6D28A8; }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable { color: #8A4B08; }
.hljs-built_in, .hljs-builtin-name { color: var(--accent); }
body.dark .hljs-string, body.dark .hljs-regexp { color: #D9A05B; }
body.dark .hljs-number, body.dark .hljs-literal { color: #8DA6FF; }
body.dark .hljs-title, body.dark .hljs-name, body.dark .hljs-section { color: #C79BFF; }
body.dark .hljs-attr, body.dark .hljs-attribute, body.dark .hljs-variable { color: #D9A05B; }

hr {
  border: none;
  text-align: center;
  margin: 2.2em 0;
  color: var(--ink-2);
  letter-spacing: 1em;
}
hr::before { content: '···'; font-size: 1.1em; }

kbd {
  font-family: inherit;
  font-size: .8em;
  border: 1px solid var(--hairline);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: .05em .45em;
  background: var(--chrome-bg);
}
mark { background: var(--accent-soft); color: inherit; }
sup { line-height: 0; }
.mermaid { text-align: center; margin: 1.4em 0; }
.mermaid svg { max-width: 100%; }

/* ============ toolbar ============ */
#toolbar {
  position: sticky; top: 0; z-index: 500;
  display: flex; align-items: center; gap: 2px;
  height: 38px; padding: 0 9px;
  background: var(--chrome-bg);
  border-bottom: 1px solid var(--hairline);
  user-select: none;
}
#toolbar button {
  display: inline-flex; align-items: center; gap: 5px;
  height: 26px; padding: 0 9px;
  border: none; border-radius: 6px; background: none; color: var(--ink-2);
  font: 12.5px/1 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  cursor: default; white-space: nowrap;
}
#toolbar button:hover { background: var(--accent-soft); color: var(--accent); }
#toolbar button.on { background: var(--accent); color: #fff; }
#toolbar .ico { font-size: 13px; line-height: 1; }
#toolbar .sep { width: 1px; height: 16px; background: var(--hairline); margin: 0 6px; flex: none; }
#toolbar .spacer { flex: 1; }
#dirty { font-size: 12px; color: var(--accent); padding-right: 4px; }

/* ============ editor ============ */
#editor {
  display: none; width: 100%;
  min-height: calc(100vh - 64px);
  padding: 44px 40px 96px;
  border: none; outline: none; resize: none;
  background: var(--paper); color: var(--ink);
  font: 14px/1.8 "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  tab-size: 2;
}
body.edit-mode #editor { display: block; }
body.edit-mode #content { display: none; }

/* ============ empty state ============ */
#empty { text-align: center; margin-top: 26vh; color: var(--ink-2); }
#empty .mark { font: 64px Georgia, serif; color: var(--accent); line-height: 1; }
#empty .name { font-size: 20px; font-weight: 650; color: var(--ink); margin: 14px 0 6px; letter-spacing: .02em; }
#empty .hint { font-size: 13px; }

/* ============ source view ============ */
#content.source-view { max-width: none; }
#content.source-view pre.src {
  font-size: 13px; line-height: 1.7; white-space: pre-wrap;
  word-break: break-word; border: none; background: none; padding: 0;
  font-family: "Cascadia Code", Consolas, monospace;
}
#content.source-view pre.src code { background: none; }

/* ============ TOC sidebar (push layout, not overlay) ============ */
#app { display: flex; }
#main { flex: 1; min-width: 0; }
#toc {
  position: sticky; top: 38px; height: calc(100vh - 38px);
  width: 0; overflow: hidden; flex: none;
  background: var(--chrome-bg);
  transition: width .22s ease;
  overflow-y: auto;
}
#toc.open { width: 264px; border-right: 1px solid var(--hairline); }
body.toc-open #status { left: 264px; }
#status { transition: left .22s ease; }
#toc .toc-inner { width: 264px; padding: 16px 0 40px; }
#toc .toc-head { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 10px 20px; }
#toc .toc-title { font-size: 11px; font-weight: 650; letter-spacing: .12em; color: var(--ink-2); }
#toc .toc-close {
  border: none; background: none; color: var(--ink-2); cursor: pointer;
  font: 16px/1 system-ui, sans-serif; padding: 4px 8px; border-radius: 5px;
}
#toc .toc-close:hover { background: var(--accent-soft); color: var(--accent); }
#toc a {
  display: block; color: var(--ink-2); text-decoration: none;
  font-size: 13px; line-height: 1.5; padding: 4px 20px;
  border-left: 2px solid transparent;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#toc a:hover { color: var(--ink); }
#toc a.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }
#toc a.l2 { padding-left: 34px; }
#toc a.l3 { padding-left: 48px; font-size: 12.5px; }

/* ============ status bar ============ */
#status {
  position: fixed; left: 0; right: 0; bottom: 0; height: 26px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; z-index: 400;
  background: var(--chrome-bg); border-top: 1px solid var(--hairline);
  font-size: 12px; color: var(--ink-2); user-select: none;
}
#status .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
#status .meta { white-space: nowrap; }
#status .dot { color: var(--accent); margin: 0 .6em; }

/* ============ context menu ============ */
#ctxmenu {
  position: fixed; display: none; z-index: 9999; min-width: 216px;
  padding: 4px; border-radius: 8px;
  font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  background: var(--chrome-bg); color: var(--ink);
  border: 1px solid var(--hairline);
  box-shadow: 0 10px 32px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.08);
}
body.dark #ctxmenu { box-shadow: 0 10px 32px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.3); }
#ctxmenu .item {
  display: flex; align-items: center; padding: 5px 10px;
  border-radius: 5px; cursor: default; white-space: nowrap;
}
#ctxmenu .item:hover { background: var(--accent); color: #fff; }
#ctxmenu .item:hover .key, #ctxmenu .item:hover .chk { color: rgba(255,255,255,.7); }
#ctxmenu .chk { width: 18px; font-size: 11px; color: var(--accent); flex: none; }
#ctxmenu .lbl { flex: 1; }
#ctxmenu .key { margin-left: 28px; font-size: 12px; color: var(--ink-2); }
#ctxmenu hr { border: none; border-top: 1px solid var(--hairline); margin: 4px 8px; }

/* ============ about dialog ============ */
dialog#about {
  border: 1px solid var(--hairline); border-radius: 12px;
  background: var(--paper); color: var(--ink);
  padding: 32px 40px; text-align: center;
  box-shadow: 0 24px 64px rgba(0,0,0,.25);
}
dialog#about::backdrop { background: rgba(0,0,0,.35); }
dialog#about .mark { font: 56px Georgia, serif; color: var(--accent); line-height: 1; }
dialog#about h2 { border: none; margin: 10px 0 4px; font-size: 20px; }
dialog#about .ver { color: var(--ink-2); font-size: 12px; margin-bottom: 18px; }
dialog#about table { font-size: 12.5px; width: auto; margin: 0 auto; }
dialog#about th, dialog#about td { padding: 3px 14px 3px 0; }
dialog#about thead, dialog#about tbody { border: none; }
dialog#about thead tr { border: none; }
dialog#about tbody tr + tr { border: none; }
dialog#about td:first-child { color: var(--ink-2); text-align: right; }
dialog#about .close {
  margin-top: 20px; padding: 6px 22px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--hairline); background: var(--chrome-bg); color: var(--ink); font: inherit; font-size: 13px;
}
dialog#about .close:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

@media print {
  #ctxmenu, #status, #toc, #toolbar, #editor, dialog { display: none !important; }
  body { background: #fff; color: #000; }
  #content { max-width: none; padding: 0; }
  a { color: #000; }
}
</style>
</head>
<body>

<script>
const ORIGIN = 'http://mdpeek.localhost';
let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
let source = null;
let fileName = '';
let docDir = '';
let showSource = false;
let tocOpen = false;
let onTop = false;
let zoom = 1;
let editMode = false;
let dirty = false;

function applyTheme() {
  document.body.classList.toggle('dark', dark);
  mermaid.initialize({
    startOnLoad: false, securityLevel: 'loose',
    theme: 'base',
    themeVariables: dark ? {
      background: '#1A1C20', primaryColor: '#22252B', primaryTextColor: '#DDD9D2',
      primaryBorderColor: '#4DBEAF', lineColor: '#8A8F98', secondaryColor: '#22252B',
      tertiaryColor: '#1F2126', fontFamily: 'inherit'
    } : {
      background: '#FAFAF8', primaryColor: '#F2F1EB', primaryTextColor: '#1C2024',
      primaryBorderColor: '#0F766E', lineColor: '#5A6270', secondaryColor: '#F2F1EB',
      tertiaryColor: '#FAFAF8', fontFamily: 'inherit'
    }
  });
}

function b64decode(b64) {
  return new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
}

// called from rust: render('<base64 markdown>', 'file.md', 'C:\\dir')
function render(b64, name, dir) {
  const incoming = b64decode(b64);
  // 编辑中且有未保存改动时，不拿磁盘内容覆盖用户手上的缓冲区
  if (editMode && dirty) return;
  source = incoming;
  fileName = name || fileName;
  if (dir !== undefined) docDir = dir;
  if (editMode) { editMode = false; document.body.classList.remove('edit-mode'); }
  rerender();
  updateToolbar();
}

/* ---------- 图片 ---------- */
// 页面跑在 http://mdpeek.localhost/ 这个假 origin 上，相对图片会被浏览器按
// 这个根去解析：`../pic.png` 里的 `..` 在请求发出前就被规范化掉，`C:\a.png`
// 还会被当成 c: 协议。所以这里用文档真实目录先算成绝对路径，再交给协议读盘。
function fixImages(root) {
  if (!docDir) return;
  const base = 'file:///' + docDir.replace(/\\/g, '/').replace(/\/?$/, '/');
  root.querySelectorAll('img[src]').forEach(img => {
    const src = img.getAttribute('src');
    if (!src) return;
    let abs;
    if (/^[a-zA-Z]:[\\/]/.test(src)) {
      abs = src;                                   // 已经是 Windows 绝对路径
    } else if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(src)) {
      return;                                      // http(s) / data: / 已重写过的，交给浏览器
    } else {
      try {
        // new URL 会把 `..`、中文、空格一并规范化，pathname 再解出绝对路径
        abs = decodeURIComponent(new URL(src, base).pathname.replace(/^\//, ''));
      } catch (e) { return; }
      // 没算成绝对路径就别动它，让 Rust 侧的兜底去解析——宁可退化，也不能指错文件
      if (!/^[a-zA-Z]:[\\/]/.test(abs)) return;
    }
    img.src = 'http://mdpeek.localhost/__file?p=' + encodeURIComponent(abs);
  });
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- 渲染结果消毒 ---------- */
// marked 会把 Markdown 里的原始 HTML 原样带出来，`<img src=x onerror=...>` 插入
// 之后就会执行脚本（innerHTML 不跑 <script>，但事件属性会跑）。DOMParser 解析出的
// 文档是惰性的：不执行脚本、不加载资源，先在那儿把事件属性和脚本类标签清掉，
// 再把节点搬进页面。这样才配上「本地图片可读 + connect-src 关掉」的组合。
function sanitize(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.body.querySelectorAll('*').forEach(el => {
    for (const attr of Array.from(el.attributes)) {
      const name = attr.name.toLowerCase();
      if (name.startsWith('on')) { el.removeAttribute(attr.name); continue; }
      if ((name === 'href' || name === 'src' || name === 'xlink:href')
          && /^\s*(javascript|vbscript|data:text\/html)/i.test(attr.value)) {
        el.removeAttribute(attr.name);
      }
    }
  });
  doc.body.querySelectorAll('script, iframe, object, embed, base').forEach(el => el.remove());
  return Array.from(doc.body.childNodes);
}

async function rerender() {
  if (source === null) return;
  const art = document.getElementById('content');
  if (showSource) {
    art.classList.add('source-view');
    art.innerHTML = '<pre class="src"><code>' + esc(source) + '</code></pre>';
  } else {
    art.classList.remove('source-view');
    art.replaceChildren(...sanitize(marked.parse(source)));
    fixImages(art);
    art.querySelectorAll('pre code.language-mermaid').forEach(c => {
      const d = document.createElement('div');
      d.className = 'mermaid';
      d.textContent = c.textContent;
      c.parentElement.replaceWith(d);
    });
    art.querySelectorAll('pre code:not(.language-mermaid)').forEach(c => hljs.highlightElement(c));
    try { await mermaid.run({ querySelector: '#content .mermaid' }); } catch (e) { console.error(e); }
  }
  buildToc();
  updateStatus();
}

/* ---------- status bar ---------- */
function updateStatus() {
  document.getElementById('st-file').textContent = fileName;
  const meta = document.getElementById('st-meta');
  if (source === null) { meta.textContent = ''; return; }
  const chars = source.replace(/\s/g, '').length;
  meta.innerHTML = `${chars.toLocaleString()} 字<span class="dot">·</span>${scrollPct()}%`;
}
function scrollPct() {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  return max <= 0 ? 100 : Math.min(100, Math.round(h.scrollTop / max * 100));
}
let scrollRaf = false;
document.addEventListener('scroll', () => {
  if (scrollRaf) return;
  scrollRaf = true;
  requestAnimationFrame(() => { scrollRaf = false; updateStatus(); updateTocActive(); });
}, { passive: true });

/* ---------- TOC ---------- */
function buildToc() {
  const box = document.getElementById('toc-items');
  box.innerHTML = '';
  const heads = document.querySelectorAll('#content h1, #content h2, #content h3');
  heads.forEach((h, i) => {
    if (!h.id) h.id = 'h-' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    a.className = 'l' + h.tagName[1];
    a.onclick = e => { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth' }); };
    box.appendChild(a);
  });
  updateTocActive();
}
function updateTocActive() {
  const links = document.querySelectorAll('#toc-items a');
  if (!links.length) return;
  const heads = document.querySelectorAll('#content h1, #content h2, #content h3');
  let cur = -1;
  heads.forEach((h, i) => { if (h.getBoundingClientRect().top < 90) cur = i; });
  links.forEach((a, i) => a.classList.toggle('active', i === (cur < 0 ? 0 : cur)));
}
function toggleToc() {
  tocOpen = !tocOpen;
  document.getElementById('toc').classList.toggle('open', tocOpen);
  document.body.classList.toggle('toc-open', tocOpen);
  updateToolbar();
}
function toggleSource() {
  if (editMode) return;
  showSource = !showSource;
  rerender();
  updateToolbar();
}
function toggleTheme() {
  dark = !dark;
  applyTheme();
  rerender();
}
function toggleOnTop() {
  onTop = !onTop;
  if (window.ipc) window.ipc.postMessage('toggle-ontop');
  updateToolbar();
}

/* ---------- 工具栏 / 编辑模式 ---------- */
function updateToolbar() {
  const on = (id, v) => document.getElementById(id).classList.toggle('on', v);
  on('tb-toc', tocOpen);
  on('tb-source', showSource && !editMode);
  on('tb-edit', editMode);
  on('tb-ontop', onTop);
  document.getElementById('tb-edit-lbl').textContent = editMode ? '完成' : '编辑';
  document.getElementById('dirty').textContent = (editMode && dirty) ? '● 未保存' : '';
  syncDirty();
}

// 脏状态只变的时候往 Rust 报一次：拖入新文件时它要靠这个决定能不能换保存目标
let dirtySent = null;
function syncDirty() {
  const v = (editMode && dirty) ? '1' : '0';
  if (v === dirtySent) return;
  dirtySent = v;
  if (window.ipc) window.ipc.postMessage('dirty:' + v);
}

// 由 rust 在拖入新文件且缓冲区有改动时调用
function mdpeekConfirmDrop() {
  if (confirm('有未保存的修改。切换到新文件会丢弃它们，继续吗？')) {
    editMode = false;
    dirty = false;
    document.body.classList.remove('edit-mode');
    updateToolbar();
    if (window.ipc) window.ipc.postMessage('drop-continue');
  } else if (window.ipc) {
    window.ipc.postMessage('drop-cancel');
  }
}

function toggleEdit() {
  if (editMode) {
    if (dirty && !confirm('有未保存的修改，确定放弃吗？')) return;
    editMode = false;
    dirty = false;
    document.body.classList.remove('edit-mode');
    rerender();
    updateToolbar();
  } else {
    if (source === null) return;
    editMode = true;
    dirty = false;
    const ed = document.getElementById('editor');
    ed.value = source;
    document.body.classList.add('edit-mode');
    ed.focus();
    updateToolbar();
  }
}

function saveFile() {
  if (!editMode) return;
  const text = document.getElementById('editor').value;
  if (window.ipc) window.ipc.postMessage('save:' + text);
  else mdpeekSaved(true, '');
}

// 由 rust 在写盘后回调
function mdpeekSaved(ok, err) {
  if (!ok) { alert('保存失败：' + err); return; }
  source = document.getElementById('editor').value;
  editMode = false;
  dirty = false;
  document.body.classList.remove('edit-mode');
  rerender();
  updateToolbar();
}

document.getElementById('editor').addEventListener('input', () => {
  if (!dirty) { dirty = true; updateToolbar(); }
});

/* ---------- zoom / keys ---------- */
document.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  zoom = Math.min(3, Math.max(0.3, zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  document.body.style.zoom = zoom;
}, { passive: false });

function setZoom(z) { zoom = z; document.body.style.zoom = z; }

document.addEventListener('keydown', e => {
  if (e.isComposing) return;
  if (e.key === 'Escape') {
    hideMenu();
    if (editMode) { toggleEdit(); return; }
    if (tocOpen) toggleToc();
    return;
  }
  if (!e.ctrlKey || e.altKey || e.metaKey) return;
  // e.key 在部分输入法状态下会变成 'Process'，退回用物理键位代码
  const k = ((e.key && e.key.length === 1) ? e.key : (e.code || '').replace(/^Key/, '')).toLowerCase();
  const cmd = {
    o: 'toc', e: 'edit', s: 'save', m: 'source', b: 'explorer',
    r: 'reload', t: 'theme', p: 'print',
    '0': 'zoom0', '=': 'zin', '+': 'zin', '-': 'zout'
  }[k];
  if (!cmd) return;
  e.preventDefault();
  switch (cmd) {
    case 'toc': toggleToc(); break;
    case 'edit': toggleEdit(); break;
    case 'save': saveFile(); break;
    case 'source': toggleSource(); break;
    case 'explorer': if (source !== null && window.ipc) window.ipc.postMessage('open-explorer'); break;
    case 'reload': if (source !== null && window.ipc) window.ipc.postMessage('reload'); break;
    case 'theme': toggleTheme(); break;
    case 'print': window.print(); break;
    case 'zoom0': setZoom(1); break;
    case 'zin': setZoom(Math.min(3, zoom * 1.1)); break;
    case 'zout': setZoom(Math.max(0.3, zoom / 1.1)); break;
  }
});

/* ---------- context menu ---------- */
const menu = document.getElementById('ctxmenu');
const hasFile = () => source !== null;
const items = [
  { label: '复制', key: 'Ctrl+C', act: () => document.execCommand('copy'), cond: () => !window.getSelection().isCollapsed },
  { label: '剪切', key: 'Ctrl+X', act: () => document.execCommand('cut'), cond: () => editMode && !window.getSelection().isCollapsed },
  { label: '粘贴', key: 'Ctrl+V', act: () => document.execCommand('paste'), cond: () => editMode },
  { label: '撤销', key: 'Ctrl+Z', act: () => document.execCommand('undo'), cond: () => editMode },
  { label: '全选', key: 'Ctrl+A', act: () => document.execCommand('selectAll') },
  'sep',
  { label: '编辑', key: 'Ctrl+E', checked: () => editMode, act: toggleEdit, cond: hasFile },
  { label: '大纲', key: 'Ctrl+O', checked: () => tocOpen, act: toggleToc, cond: hasFile },
  { label: '查看 Markdown 源码', key: 'Ctrl+M', checked: () => showSource, act: toggleSource, cond: hasFile },
  'sep',
  { label: '用记事本打开', act: () => window.ipc.postMessage('edit-notepad'), cond: hasFile },
  { label: '在资源管理器中显示', key: 'Ctrl+B', act: () => window.ipc.postMessage('open-explorer'), cond: hasFile },
  { label: '复制文件路径', act: () => window.ipc.postMessage('copy-path'), cond: hasFile },
  { label: '复制 Markdown 源码', act: () => window.ipc.postMessage('copy-source'), cond: hasFile },
  'sep',
  { label: '窗口置顶', checked: () => onTop, act: toggleOnTop },
  { label: '刷新', key: 'Ctrl+R', act: () => window.ipc.postMessage('reload'), cond: hasFile },
  { label: '主题切换', key: 'Ctrl+T', act: toggleTheme },
  'sep',
  { label: '放大', key: 'Ctrl++', act: () => setZoom(Math.min(3, zoom * 1.1)) },
  { label: '缩小', key: 'Ctrl+-', act: () => setZoom(Math.max(0.3, zoom / 1.1)) },
  { label: '重置缩放', key: 'Ctrl+0', act: () => setZoom(1) },
  'sep',
  { label: '打印 / 导出 PDF', key: 'Ctrl+P', act: () => window.print() },
  { label: '关于 mdpeek', act: () => document.getElementById('about').showModal() },
];

function hideMenu() { menu.style.display = 'none'; }

document.addEventListener('contextmenu', e => {
  e.preventDefault();
  menu.innerHTML = '';
  let lastWasSep = true;
  for (const it of items) {
    if (it === 'sep') {
      if (lastWasSep) continue;
      menu.appendChild(document.createElement('hr'));
      lastWasSep = true;
      continue;
    }
    if (it.cond && !it.cond()) continue;
    const d = document.createElement('div');
    d.className = 'item';
    const chk = it.checked ? (it.checked() ? '✓' : '') : '';
    d.innerHTML = `<span class="chk">${chk}</span><span class="lbl">${it.label}</span><span class="key">${it.key || ''}</span>`;
    d.onclick = () => { hideMenu(); it.act(); };
    menu.appendChild(d);
    lastWasSep = false;
  }
  menu.style.display = 'block';
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.min(e.clientX, innerWidth - mw - 8) + 'px';
  menu.style.top = Math.min(e.clientY, innerHeight - mh - 8) + 'px';
});
document.addEventListener('mousedown', e => { if (!menu.contains(e.target)) hideMenu(); });
document.addEventListener('blur', hideMenu);
document.addEventListener('wheel', hideMenu);

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  dark = e.matches; applyTheme(); rerender();
});

applyTheme();
updateStatus();
updateToolbar();
if (window.ipc) window.ipc.postMessage('ready');
</script>
</body>
</html>
